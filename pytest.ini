[pytest]
testpaths = tests
asyncio_mode = auto

# Treat unregistered markers / unknown config keys as errors so typos surface fast.
addopts =
    -ra
    --strict-markers
    --strict-config

# Quiet down warnings that are not actionable for this project.
filterwarnings =
    # passlib 1.7.x reads bcrypt.__about__.__version__ which bcrypt 4.x removed.
    # Harmless; pinning bcrypt==4.0.1 in requirements.txt already mitigates.
    ignore::DeprecationWarning:passlib
    # SQLAlchemy 2.x emits MovedIn20Warning from indirect imports in some test paths.
    ignore::DeprecationWarning:sqlalchemy
