# Compose project name is pinned so volume / network / container prefixes
# stay consistent regardless of the parent folder name on disk.
name: mnema

services:

  db:
    image: pgvector/pgvector:pg17
    container_name: mnema_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mnema_net

  # Web UI for inspecting the database — http://localhost:5050
  # The "Mnema DB" server is pre-registered via servers.json so it shows up
  # in the tree automatically; you only enter the DB password ("postgres")
  # the first time you expand it.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mnema_pgadmin
    restart: unless-stopped
    # Optional DB inspection GUI — NOT started by default (it ships with
    # admin/admin and the master password disabled, so it must never run
    # on a shared/production host). Start it only when you need it:
    #   docker compose --profile tools up
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Accept the short default login password and skip the extra
      # master-password prompt so first login is just email + password.
      PGADMIN_CONFIG_PASSWORD_LENGTH_MIN: 1
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - mnema_net

  ollama:
    image: ollama/ollama:latest
    container_name: mnema_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h
    # GPU acceleration is the default — it's dramatically faster than CPU.
    # Requires the NVIDIA Container Toolkit on the host.
    # No NVIDIA GPU? Comment out this whole `deploy:` block to fall back to
    # CPU (slower, but works on any machine).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # /api/tags is the cheapest endpoint that confirms the daemon is serving HTTP.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - mnema_net

  # One-shot init container: pulls the configured model once Ollama is healthy,
  # then exits. The app waits for this to complete successfully before booting.
  # Without this, a fresh `docker compose up` starts an Ollama with no model
  # and every /api/chat call returns 404.
  ollama-init:
    image: ollama/ollama:latest
    container_name: mnema_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
    entrypoint: >
      sh -c "
        echo '[ollama-init] Pulling model: '$$OLLAMA_MODEL;
        ollama pull $$OLLAMA_MODEL &&
        echo '[ollama-init] Model ready: '$$OLLAMA_MODEL
      "
    restart: "no"
    networks:
      - mnema_net

  app:
    build: .
    container_name: mnema_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Force the in-container hostnames even if .env has localhost values
      # (this prevents "ConnectError: connect to localhost:11434" inside the container).
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: postgresql+asyncpg://app:postgres@db:5432/app
    volumes:
      - uploads_data:/app/uploads
      # Named volume by default — models persist across rebuilds without
      # requiring a host-specific path. Override with HF_CACHE_DIR in .env
      # to bind-mount your local HF cache and skip the first-run download.
      - ${HF_CACHE_DIR:-huggingface_cache}:/root/.cache/huggingface
    command: >
      sh -c "python scripts/docker_entrypoint.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - mnema_net

# Ollama runs on the GPU by default (see the `deploy:` block on the ollama
# service). Requires the NVIDIA Container Toolkit on the host. To run on CPU
# instead, comment out that block.

networks:
  mnema_net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  ollama_data:
  uploads_data:
  huggingface_cache:
