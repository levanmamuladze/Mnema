name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres + pgvector so the RBAC isolation tests exercise the actual
    # retrieval query path (not a SQLite stand-in).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Strong, validator-passing key so config import never fails in CI.
      SECRET_KEY: ci-PpQ7sZ2vTnB9mLkJ4hWxYcRdFgEa6UoIs3NrKqMbVdHwXt5Cu
      DEBUG: "true"
      # Used only by the RBAC isolation integration test; the unit tests run
      # against the lazy fake DSN set in tests/conftest.py.
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (unit + RBAC isolation)
        run: pytest -ra
