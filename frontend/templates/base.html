<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Mnema{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css"/>
  <!-- DOMPurify: sanitise all HTML before injecting into the DOM -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <a class="navbar-brand" href="/" aria-label="Mnema home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--primary)">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>
      Mnema
    </a>
    <div class="navbar-links" id="nav-links">
      <a href="/chat-ui" id="nav-chat" style="display:none" aria-label="Go to chat">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat
      </a>
      <a href="/admin-ui" id="nav-admin" style="display:none" aria-label="Go to admin panel">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Admin
      </a>
      <a href="/" id="nav-login">Sign in</a>
      <button id="btn-logout" style="display:none" class="btn btn-ghost btn-sm" onclick="logout()" aria-label="Sign out">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>
  </nav>
  <main class="page-layout" style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
    {% block content %}{% endblock %}
  </main>
  <!-- Synchronous nav init: update nav links from sessionStorage before first paint -->
  <script>
  (function(){
    try {
      var u = JSON.parse(sessionStorage.getItem('user') || 'null');
      if (u && u.id) {
        var nc = document.getElementById('nav-chat');
        var na = document.getElementById('nav-admin');
        var bl = document.getElementById('btn-logout');
        var nl = document.getElementById('nav-login');
        if (nc) nc.style.display = 'inline-flex';
        if (bl) bl.style.display = 'inline-flex';
        if (nl) nl.style.display = 'none';
        // Show the Admin link to superusers AND role-admins (any membership
        // with is_role_admin=true). The server still enforces per-action
        // RBAC — the link just makes the upload UI reachable.
        var canAdmin = !!u.is_superuser
          || (Array.isArray(u.memberships) && u.memberships.some(m => m.is_role_admin));
        if (na && canAdmin) na.style.display = 'inline-flex';
      }
    } catch(_) {}
  })();
  </script>
  <script src="/static/js/auth.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
