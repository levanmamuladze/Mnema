{% extends "base.html" %}
{% block title %}Sign In — Mnema{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="card auth-card">
    <div class="auth-logo" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1 class="card-title">Welcome back</h1>
    <p class="card-subtitle">Sign in to your onboarding assistant</p>
    <div id="error-msg" class="alert alert-error" style="display:none" role="alert"></div>
    <form id="login-form" onsubmit="handleLogin(event)" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Enter username"
               required autocomplete="username" autofocus/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Enter password"
               required autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="btn-login">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function handleLogin(e) {
  e.preventDefault();
  const btn    = document.getElementById('btn-login');
  const errEl  = document.getElementById('error-msg');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span> Signing in…';

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      credentials: 'include',          // receive + store the HttpOnly cookie
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Login failed');

    // Fetch user profile (cookie is already set — no token juggling needed)
    const meRes = await fetch('/auth/me', { credentials: 'include' });
    const me    = await meRes.json();
    // Cache non-sensitive profile in sessionStorage for UI nav only
    try { sessionStorage.setItem('user', JSON.stringify(me)); } catch (_) {}

    window.location.href = me.is_superuser ? '/admin-ui' : '/chat-ui';
  } catch (err) {
    errEl.textContent    = err.message;
    errEl.style.display  = 'block';
    btn.disabled         = false;
    btn.innerHTML        = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Sign In';
  }
}
</script>
{% endblock %}
